services:
  mysql:
    image: mysql:8.4
    container_name: tech-blog-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: tech_blog
      MYSQL_USER: tech_blog
      MYSQL_PASSWORD: tech_blog
    volumes:
      - tech-blog-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpw"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  tech-blog-mysql-data:
